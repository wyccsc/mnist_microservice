name: Build & Push Microservices

on:
  push:
    branches: ["main"]

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      api_changed: ${{ steps.filter.outputs.api }}
      model_changed: ${{ steps.filter.outputs.model }}
    steps:
      - uses: actions/checkout@v3

      - name: Detect changed folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend-service/**'
            api:
              - 'api-service/**'
            model:
              - 'model-service/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- FRONTEND ----
      - name: Build & push frontend
        if: needs.detect-changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-service:1.0.0
            ${{ secrets.DOCKER_USERNAME }}/frontend-service:latest

      # ---- API ----
      - name: Build & push api
        if: needs.detect-changes.outputs.api_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./api-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/api-service:1.0.0
            ${{ secrets.DOCKER_USERNAME }}/api-service:latest

      # ---- MODEL ----
      - name: Build & push model
        if: needs.detect-changes.outputs.model_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./model-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/model-service:1.0.0
            ${{ secrets.DOCKER_USERNAME }}/model-service:latest