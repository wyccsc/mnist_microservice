name: Frontend CI/CD

on:
  push:
    paths:
      - "api-service/**"

on:
  push:
    paths:
      - "frontend-service/**"

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: bump
        run: |
          # 取最新 tag
          git fetch --tags
          LAST=$(git tag --list "frontend-*" | sort -V | tail -n1 || echo "")
          if [ -z "$LAST" ]; then
            NEW="1.0.0"
          else
            BASE=${LAST#frontend-}
            PATCH=$(echo $BASE | awk -F. '{print $3+1}')
            NEW="$(echo $BASE | awk -F. '{print $1"."$2}').$PATCH"
          fi
          echo "NEW_VERSION=$NEW" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag frontend-${{ steps.bump.outputs.NEW_VERSION }}
          git push origin frontend-${{ steps.bump.outputs.NEW_VERSION }}

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mnist_microservice/frontend-service:${{ steps.bump.outputs.NEW_VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/mnist_microservice/frontend-service:latest